<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AutoStock</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles/login.css}">
</head>
<body>
  <div class="card">
    <div class="title">Acessar Conta</div>
    <div th:if="${param.reset_success}" class="messageSuccess">
      Você redefiniu sua senha com sucesso! Faça o login abaixo.
    </div>
    <div th:if="${param.verified}" class="messageNormal">
      Esta conta já foi verificada, faça o login.
    </div>
    <div th:if="${param.valid}" class="messageSuccess">
      E-mail verificado com sucesso! Faça o login.
    </div>
    <div th:if="${param.logout}" class="messageNormal">
      Você foi desconectado com sucesso.
    </div>
	<div th:if="${successMessage}" class="alert alert-success text-center mt-3">
	    <i class="bi bi-check-circle"></i>
	    <span th:text="${successMessage}"></span>
	</div>
    <div id="login-error" class="messageError hide"></div>
    <div id="senha-error" class="messageError hide"></div>
    <form id="login-form">
      <div class="input-field mb-3">
        <input type="text" id="login" name="login" placeholder="E-mail ou CNPJ" required />
      </div>
      <div class="input-field mb-3">
        <button type="submit" class="btn btn-primary">Avançar</button>
      </div>
    </form>
    <form id="senha-form" class="hide" method="post" action="/login">
      <input type="hidden" name="login" id="login-hidden" />
      <div class="input-field mb-3">
        <input type="password" name="password" placeholder="Digite sua senha" required />
      </div>
      <div class="input-field mb-3">
        <button type="submit" class="btn btn-primary">Entrar</button>
      </div>
    </form>
    <div class="login-links">
      <a href="/registration/forgot-password-request">Esqueci minha senha</a>
      <span class="text-muted"> | </span>
      <span class="text-muted">Não possui cadastro? <a href="/registration/registration-form">Cadastre-se</a></span>
    </div>
    <footer>© 2025 AutoStock</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/imask"></script>
  <script src="/scripts/login.js" th:src="@{/scripts/login.js}"></script>
</body>
</html>
