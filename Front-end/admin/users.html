<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gerenciar Usuários</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<link rel="stylesheet" th:href="@{/styles/home.css}">
	<link rel="stylesheet" th:href="@{/styles/admin-users.css}">
</head>

<body>

	<header class="home-header">
		<div class="home-header-inner">
			<div class="brand-block">
				<div class="brand-icon"><i class="fa-solid fa-car"></i></div>
				<div>
					<div class="brand-title">AutoStock</div>
					<div class="brand-subtitle">Gestão inteligente</div>
				</div>
			</div>
			<div class="header-actions">
				<a href="/admin/dashboard" class="header-icon">
					<i class="fa-solid fa-house"></i>
				</a>

				<a href="/admin/bloqueados" class="header-icon">
					<i class="fa-solid fa-user-lock"></i>
				</a>

				<a th:href="@{/logout}" class="header-icon">
					<i class="fa-solid fa-right-from-bracket"></i>
				</a>
			</div>
		</div>
	</header>

	<div class="container users-container">

		<div class="page-title-wrapper">
			<div class="page-title-icon">
				<i class="fa-solid fa-users-gear"></i>
			</div>
			<h2 class="page-title-text">Usuários do Sistema</h2>
		</div>

		<div th:if="${#lists.isEmpty(users)}" class="empty-card shadow-sm">
			Nenhum usuário cadastrado ainda.
		</div>

		<div th:if="${!#lists.isEmpty(users)}" class="table-card shadow-sm">

			<table class="table table-hover align-middle user-table">
				<thead>
					<tr>
						<th>ID</th>
						<th>Email</th>
						<th>CNPJ</th>
						<th>Cidade</th>
						<th>Status</th>
						<th class="text-end">Ações</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="u : ${users}">
						<td th:text="${u.id}"></td>
						<td th:text="${u.email}"></td>
						<td th:text="${u.cnpj}"></td>
						<td th:text="${u.cidade}"></td>

						<td>
							<span class="badge bg-success" th:if="${!u.accountLocked}">Ativo</span>
							<span class="badge bg-danger" th:if="${u.accountLocked}">Bloqueado</span>
						</td>

						<td class="text-end actions-col">
							<a th:href="@{/admin/editar/{id}(id=${u.id})}" class="action-btn edit-btn">
								<i class="fa-solid fa-pen"></i> Editar
							</a>

							<form th:action="@{/admin/excluir/{id}(id=${u.id})}" method="post" class="d-inline"
								onsubmit="return confirmDelete(event, 'Você tem certeza que deseja excluir este usuário?')">
								<button class="action-btn delete-btn">
									<i class="fa-solid fa-trash"></i> Excluir
								</button>
							</form>
						</td>

					</tr>
				</tbody>

			</table>
		</div>

		<div class="user-mobile-list" th:if="${!#lists.isEmpty(users)}">

			<div class="user-mobile-card" th:each="u : ${users}">

				<div class="mob-line">
					<span class="mob-label">Email:</span>
					<span th:text="${u.email}"></span>
				</div>

				<div class="mob-line">
					<span class="mob-label">CNPJ:</span>
					<span th:text="${u.cnpj}"></span>
				</div>

				<div class="mob-line">
					<span class="mob-label">Cidade:</span>
					<span th:text="${u.cidade}"></span>
				</div>

				<div class="mob-line">
					<span class="mob-label">Status:</span>
					<span th:text="${u.accountLocked ? 'Bloqueado' : 'Ativo'}"></span>
				</div>

				<div class="mob-actions">
					<a th:href="@{/admin/editar/{id}(id=${u.id})}" class="mob-btn mob-edit">
						<i class="fa-solid fa-pen"></i> Editar
					</a>

					<form th:action="@{/admin/excluir/{id}(id=${u.id})}" method="post"
						onsubmit="return confirmDelete(event, 'Você tem certeza que deseja excluir este usuário?')">
						<button class="mob-btn mob-delete">
							<i class="fa-solid fa-trash"></i> Excluir
						</button>
					</form>
				</div>
			</div>
		</div>
	</div>
	<footer>
		© 2025 AutoStock — Administração do sistema.
	</footer>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script th:src="@{/scripts/delete-confirm.js}"></script>
</body>

</html>
