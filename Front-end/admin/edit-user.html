<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/styles/home.css}">
    <link rel="stylesheet" th:href="@{/styles/admin-edit-user.css}">
</head>

<body>

    <header class="home-header">
        <div class="home-header-inner">

            <div class="brand-block">
                <div class="brand-icon"><i class="fa-solid fa-car"></i></div>
                <div>
                    <div class="brand-title">AutoStock</div>
                    <div class="brand-subtitle">Gestão inteligente</div>
                </div>
            </div>

            <div class="header-actions">
                <a href="/admin/dashboard" class="header-icon"><i class="fa-solid fa-house"></i></a>
                <a href="/admin/usuarios" class="header-icon"><i class="fa-solid fa-users"></i></a>
                <a th:href="@{/logout}" class="header-icon"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>

        </div>
    </header>

    <main class="container mt-4 form-container">

        <div class="page-title-wrapper">
            <i class="fa-solid fa-user-pen page-title-icon"></i>
            <h2 class="page-title-text">Editar Usuário</h2>
        </div>

        <form id="editUserForm" th:action="@{/admin/editar/{id}(id=${user.id})}" method="post">

            <section>
                <div class="card mb-3">
                    <div class="section-title">
                        <div class="section-icon-wrapper">
                            <span class="section-number">1</span>
                            <i class="fa-solid fa-id-card"></i>
                        </div>
                        <h4 class="section-label">Informações da Conta</h4>
                    </div>

                    <div class="card-body row g-3">

                        <div class="col-md-6">
                            <label>Email</label>
                            <input type="text" class="form-control" name="email" id="email" th:value="${user.email}">
                        </div>

                        <div class="col-md-6">
                            <label>CNPJ</label>
                            <input type="text" class="form-control" name="cnpj" id="cnpj" th:value="${user.cnpj}">
							<small class="invalid-feedback" id="cnpj-error" style="display:none;">
							    CNPJ inválido. Digite um CNPJ válido.
							</small>
                        </div>

                    </div>
                </div>
            </section>

            <section>
                <div class="card mb-3">
                    <div class="section-title">
                        <div class="section-icon-wrapper">
                            <span class="section-number">2</span>
                            <i class="fa-solid fa-building"></i>
                        </div>
                        <h4 class="section-label">Dados da Empresa</h4>
                    </div>

                    <div class="card-body row g-3">

                        <div class="col-md-6">
                            <label>Razão Social</label>
                            <input type="text" class="form-control" name="razaoSocial" th:value="${user.razaoSocial}">
                        </div>

                        <div class="col-md-6">
                            <label>Nome Fantasia</label>
                            <input type="text" class="form-control" name="nomeFantasia" th:value="${user.nomeFantasia}">
                        </div>

                    </div>
                </div>
            </section>

            <section>
                <div class="card mb-3">
                    <div class="section-title">
                        <div class="section-icon-wrapper">
                            <span class="section-number">3</span>
                            <i class="fa-solid fa-map-location-dot"></i>
                        </div>
                        <h4 class="section-label">Endereço</h4>
                    </div>

                    <div class="card-body row g-3">

                        <div class="col-md-4">
                            <label>CEP</label>
                            <input class="form-control" id="cep" name="cep" th:value="${user.cep}">
							<small class="invalid-feedback" id="cep-error" style="display:none;">
							    CEP inválido. Exemplo: 00000-000.
							</small>
                        </div>

                        <div class="col-md-8">
                            <label>Logradouro</label>
                            <input class="form-control" id="logradouro" name="logradouro" th:value="${user.logradouro}">
                        </div>

                        <div class="col-md-4">
                            <label>Número</label>
                            <input class="form-control" name="numero" th:value="${user.numero}">
                        </div>

                        <div class="col-md-8">
                            <label>Complemento</label>
                            <input class="form-control" name="complemento" th:value="${user.complemento}">
                        </div>

                        <div class="col-md-6">
                            <label>Bairro</label>
                            <input class="form-control" id="bairro" name="bairro" th:value="${user.bairro}">
                        </div>

                        <div class="col-md-4">
                            <label>Cidade</label>
                            <input class="form-control" id="cidade" name="cidade" th:value="${user.cidade}">
                        </div>

                        <div class="col-md-2">
                            <label>UF</label>
                            <input class="form-control" id="uf" name="uf" th:value="${user.uf}">
                        </div>

                    </div>
                </div>
            </section>

            <section>
                <div class="card mb-3">
                    <div class="section-title">
                        <div class="section-icon-wrapper">
                            <span class="section-number">4</span>
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <h4 class="section-label">Informações de Contato</h4>
                    </div>

                    <div class="card-body row g-3">

                        <div class="col-md-6">
                            <label>Telefone</label>
                            <input class="form-control" name="telefone" id="telefone" th:value="${user.telefone}">
							<small class="invalid-feedback" id="telefone-error" style="display:none;">
							    Telefone inválido. Exemplo: (11) 99999-9999
							</small>
                        </div>

                    </div>
                </div>
            </section>

            <div class="action-buttons">
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-check-circle me-1"></i> Salvar Alterações
                </button>
            </div>

        </form>

    </main>

    <footer>
        © 2025 AutoStock — Administração do sistema.
    </footer>

    <script th:src="@{/scripts/admin-edit-user.js}"></script>

</body>

</html>
