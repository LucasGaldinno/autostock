<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - AutoStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/styles/admin-dashboard.css}">
    <link rel="stylesheet" th:href="@{/styles/home.css}">
</head>

<body>

<header class="home-header">
    <div class="home-header-inner">
        <div class="brand-block">
            <div class="brand-icon"><i class="fa-solid fa-car"></i></div>
            <div>
                <div class="brand-title">AutoStock</div>
                <div class="brand-subtitle">Gestão inteligente</div>
            </div>
        </div>
		<div class="header-actions">
		    <a href="/admin/dashboard" class="header-icon">
		        <i class="fa-solid fa-house"></i>
		    </a>

		    <a href="/admin/usuarios" class="header-icon">
		        <i class="fa-solid fa-users"></i>
		    </a>

		    <a href="/admin/bloqueados" class="header-icon">
		        <i class="fa-solid fa-user-lock"></i>
		    </a>

		    <a th:href="@{/logout}" class="header-icon">
		        <i class="fa-solid fa-right-from-bracket"></i>
		    </a>
		</div>
    </div>
</header>

<div class="container mt-4">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <h2 class="fw-bold m-0">
            Dashboard do administrador
        </h2>
    </div>
	<div class="row g-4">
	    <div class="col-md-6">
	        <a href="/admin/usuarios" class="card-link-wrapper">
	            <div class="card shadow-sm border-0 dashboard-card">
	                <div class="card-body text-center p-4">
	                    <div class="card-header-icon">
	                        <i class="fa-solid fa-users text-primary"></i>
	                    </div>
	                    <h5 class="card-title mb-2">Total de Usuários</h5>
	                    <p class="display-5 fw-bold text-primary" th:text="${totalUsers}"></p>
	                </div>
	            </div>
	        </a>
	    </div>

	    <div class="col-md-6">
	        <a href="/admin/bloqueados" class="card-link-wrapper">
	            <div class="card shadow-sm border-0 dashboard-card">
	                <div class="card-body text-center p-4">
	                    <div class="card-header-icon">
	                        <i class="fa-solid fa-user-lock text-danger"></i>
	                    </div>
	                    <h5 class="card-title mb-2">Usuários Bloqueados</h5>
	                    <p class="display-5 fw-bold text-danger" th:text="${lockedUsers}"></p>
	                </div>
	            </div>
	        </a>
	    </div>
	</div>
	
	<footer>
	  © 2025 AutoStock — Sistema completo para lojas de veículos.
	</footer>

</div>

</body>
</html>
