<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerar Contrato de Venda - AutoStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/styles/contracts.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles/home.css}">
</head>
<body>

<header class="home-header">
    <div class="home-header-inner">
        <div class="brand-block">
            <div class="brand-icon"><i class="fa-solid fa-car"></i></div>
            <div>
                <div class="brand-title">AutoStock</div>
                <div class="brand-subtitle">Gestão inteligente</div>
            </div>
        </div>
        <div class="header-actions">
            <a href="/home" class="header-icon"><i class="fa-solid fa-house"></i></a>
            <a href="/vehicles/fipe/consulta" class="header-icon"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a th:href="@{/logout}" class="header-icon"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
    </div>
</header>

  <main class="container mt-4">
    <div class="form-container">
		<h2 class="page-title">
		    <i class="fa-solid fa-file-signature"></i>
		    Gerar Contrato de Venda
		</h2>
		
      <div th:if="${errorMessage}" class="alert alert-warning text-center" th:text="${errorMessage}"></div>

      <form th:action="@{/contracts/generate}" th:object="${contract}" method="post" enctype="multipart/form-data" class="row g-3">

		<div class="col-12">
		  <div class="card">
		    <div class="card-body">
				<h5 class="section-title">
				    <span class="section-number">1</span>
				    <i class="fa-solid fa-car section-icon"></i>
				    Selecionar Veículo
				</h5>
		      <div class="form-group">
		        <label for="vehicleSelect" class="form-label fw-semibold">Veículo *</label>
		        <select th:field="*{vehicle.id}" class="form-select" required id="vehicleSelect">
		          <option value="">Selecione...</option>
		          <option th:each="v : ${vehicles}"
		                  th:value="${v.id}"
		                  th:data-plate="${v.plate}"
		                  th:data-brand="${v.brand}"
		                  th:data-model="${v.model}"
		                  th:data-version="${v.version}"
		                  th:data-year="${v.modelYear}"
		                  th:data-color="${v.color.label}"
		                  th:data-km="${v.mileage}"
						  th:data-price="${v.purchasePrice}" 
		                  th:text="${v.brand + ' ' + v.model + ' - ' + v.version + ' (' + v.plate + ')'}">
		          </option>
		        </select>
		      </div>
		    </div>
		  </div>
		</div>

		<div class="col-12">
		  <div class="card">
		    <div class="card-body">

		      <div class="vehicle-summary-box">

		        <div class="vehicle-summary-title">
		          <i class="bi bi-car-front"></i> Resumo do Veículo
		        </div>

		        <div id="vehiclePreview">
		          <p class="text-muted m-0">Selecione um veículo para ver os detalhes.</p>
		        </div>

		      </div>

		    </div>
		  </div>
		</div>

        <div class="col-12">
          <div class="card">
            <div class="card-body">
				<h5 class="section-title">
				    <span class="section-number">2</span>
				    <i class="fa-solid fa-user section-icon"></i>
				    Dados do Cliente
				</h5>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Nome do Cliente *</label>
                  <input th:field="*{customerName}" class="form-control" placeholder="Nome completo" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">CPF *</label>
                  <input th:field="*{cpf}" class="form-control" id="cpfField" placeholder="000.000.000-00" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">E-mail *</label>
                  <input th:field="*{customerEmail}" type="email" class="form-control" placeholder="email@exemplo.com" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Telefone *</label>
                  <input th:field="*{customerPhone}" class="form-control" id="phoneField" placeholder="(11) 98765-4321" required />
                </div>
                <div class="col-md-3">
                  <label class="form-label">CEP *</label>
                  <input th:field="*{cep}" class="form-control" id="cepField" placeholder="00000-000" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Endereço *</label>
                  <input th:field="*{address}" class="form-control" id="address" placeholder="Rua, Avenida..." required />
                </div>
                <div class="col-md-2">
                  <label class="form-label">Número *</label>
                  <input th:field="*{number}" class="form-control" id="number" placeholder="123" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Complemento *</label>
                  <input th:field="*{complement}" class="form-control" id="complement" placeholder="Apto, Bloco..." required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Bairro *</label>
                  <input th:field="*{neighborhood}" class="form-control" id="neighborhood" placeholder="Bairro" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Cidade *</label>
                  <input th:field="*{city}" class="form-control" id="city" placeholder="Cidade" required />
                </div>
                <div class="col-md-2">
					<label class="form-label">UF *</label>
					<select id="ufSelect" class="form-select" th:field="*{state}" required>
					    <option value="">Selecione...</option>
					    <option value="AC">AC</option>
					    <option value="AL">AL</option>
					    <option value="AP">AP</option>
					    <option value="AM">AM</option>
					    <option value="BA">BA</option>
					    <option value="CE">CE</option>
					    <option value="DF">DF</option>
					    <option value="ES">ES</option>
					    <option value="GO">GO</option>
					    <option value="MA">MA</option>
					    <option value="MT">MT</option>
					    <option value="MS">MS</option>
					    <option value="MG">MG</option>
					    <option value="PA">PA</option>
					    <option value="PB">PB</option>
					    <option value="PR">PR</option>
					    <option value="PE">PE</option>
					    <option value="PI">PI</option>
					    <option value="RJ">RJ</option>
					    <option value="RN">RN</option>
					    <option value="RS">RS</option>
					    <option value="RO">RO</option>
					    <option value="RR">RR</option>
					    <option value="SC">SC</option>
					    <option value="SP">SP</option>
					    <option value="SE">SE</option>
					    <option value="TO">TO</option>
					</select>
                </div>
              </div>
            </div>
          </div>
        </div>

		<div class="col-12">
		  <div class="card">
		    <div class="card-body">
				<h5 class="section-title">
				    <span class="section-number">3</span>
				    <i class="fa-solid fa-money-bill-wave section-icon"></i>
				    Condições de Pagamento
				</h5>
				
		      <div class="row g-4">

		        <div class="col-md-6">
		          <label class="form-label fw-semibold">Tipo de negociação *</label>

		          <div class="btn-group w-100" role="group">

		            <input type="radio" class="btn-check"
		                   id="negAvista"
		                   th:field="*{negotiationType}"
		                   value="À vista"
		                   required>
		            <label class="btn btn-outline-primary" for="negAvista">À vista</label>

		            <input type="radio" class="btn-check"
		                   id="negFin"
		                   th:field="*{negotiationType}"
		                   value="Financiamento">
		            <label class="btn btn-outline-primary" for="negFin">Financiamento</label>

		            <input type="radio" class="btn-check"
		                   id="negPix"
		                   th:field="*{negotiationType}"
		                   value="Pix">
		            <label class="btn btn-outline-primary" for="negPix">Pix</label>

		          </div>
		        </div>

				<div class="col-md-6">
				  <label class="form-label fw-semibold">Preço de venda (R$) *</label>
				  <input th:field="*{salePrice}"
				         type="text"
				         class="form-control"
				         id="salePrice" placeholder="15.000,00"
				         required>
				</div>
		      </div>

		    </div>
		  </div>
		</div>

		<div class="col-12">
		    <div class="card">
		        <div class="card-body">
					<h5 class="section-title">
					    <span class="section-number">4</span>
					    <i class="fa-solid fa-signature section-icon"></i>
					    Assinaturas Digitais
					</h5>
		            <div class="row g-3">
		                <div class="col-md-6">
		                    <label class="form-label fw-semibold">Assinatura digital da agência (PNG opcional)</label>
		                    <input type="file" name="agencySignatureFile" accept="image/png" class="form-control" />
		                </div>
		                <div class="col-md-6">
		                    <label class="form-label fw-semibold">Assinatura digital do cliente (PNG opcional)</label>
		                    <input type="file" name="customerSignatureFile" accept="image/png" class="form-control" />
		                </div>
		            </div>
		        </div>
		    </div>
		</div>
        <div class="col-12 text-center mt-3">
			<button type="submit" class="btn btn-success px-5 py-2 fw-semibold" id="submitBtn">
			    <i class="fa-solid fa-paper-plane"></i> Gerar e enviar contrato
			</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    © 2025 AutoStock — Sistema completo para lojas de veículos.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/imask"></script>
  <script src="/scripts/contracts.js" th:src="@{/scripts/contracts.js}"></script>
</body>
</html>
