<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Convidar Funcionário</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

	<link rel="stylesheet" th:href="@{/styles/home.css}">
	<link rel="stylesheet" th:href="@{/styles/employee-invite.css}">
</head>

<body>

	<header class="home-header">
		<div class="home-header-inner">
			<div class="brand-block">
				<div class="brand-icon"><i class="fa-solid fa-car"></i></div>
				<div>
					<div class="brand-title">AutoStock</div>
					<div class="brand-subtitle">Gestão inteligente</div>
				</div>
			</div>

			<div class="header-actions">
				<a href="/home" class="header-icon"><i class="fa-solid fa-house"></i></a>
				<a href="/vehicles/fipe/consulta" class="header-icon"><i class="fa-solid fa-magnifying-glass"></i></a>
				<a th:href="@{/logout}" class="header-icon"><i class="fa-solid fa-right-from-bracket"></i></a>
			</div>
		</div>
	</header>

	<div class="container">

		<div class="invite-card">

			<h1 class="invite-title">Convidar Funcionário</h1>
			<p class="invite-subtitle">
				Envie um convite para que o funcionário possa acessar o sistema
			</p>

			<div th:if="${toastSuccess}" class="alert alert-success text-center">
				<i class="bi bi-check-circle"></i>
				<span th:text="${toastSuccess}"></span>
			</div>

			<div th:if="${toastError}" class="alert alert-danger text-center">
				<i class="bi bi-exclamation-circle"></i>
				<span th:text="${toastError}"></span>
			</div>

			<form th:action="@{/funcionario/convite}" method="post">

				<label class="input-label">E-mail do funcionário</label>

				<div class="input-wrapper">
					<i class="fa-solid fa-envelope"></i>
					<input type="email" name="email" placeholder="Digite o e-mail para enviar o convite" required>
				</div>

				<button class="invite-btn" type="submit">
					<i class="fa-solid fa-paper-plane"></i>
					Enviar Convite
				</button>

				<div class="invite-note">
					<strong>Nota:</strong> O funcionário receberá um e-mail com instruções para criar sua conta e
					acessar o sistema.
				</div>

			</form>
		</div>

	</div>

	<footer>
		© 2025 AutsoStock — Sistema completo para lojas de veículos.
	</footer>

</body>

</html>
