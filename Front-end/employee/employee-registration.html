<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro de Funcionário</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/styles/employee-registration.css}">
</head>

<body>

	<div class="registration-container">

		<h2 class="fw-bold mb-4">Complete seu Cadastro</h2>

		<div th:if="${error}" class="alert alert-danger text-center">
			<i class="bi bi-exclamation-circle"></i>
			<span th:text="${error}"></span>
		</div>

		<form th:action="@{/funcionario/cadastro(token=${param.token})}" method="post" th:object="${employeeDTO}">

			<div class="row g-3">

				<div class="col-md-6">
					<label class="form-label">Nome</label>
					<input class="form-control" th:field="*{firstName}" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}"
						th:errors="*{firstName}">
					</div>
				</div>

				<div class="col-md-6">
					<label class="form-label">Sobrenome</label>
					<input class="form-control" th:field="*{lastName}" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('lastName')}"
						th:errors="*{lastName}">
					</div>
				</div>

				<div class="col-md-6">
					<label class="form-label">CPF</label>
					<input id="cpf" class="form-control" th:field="*{cpf}" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}">
					</div>
				</div>

				<div class="col-md-6">
					<label class="form-label">RG</label>
					<input class="form-control" th:field="*{rg}" maxlength="12" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('rg')}" th:errors="*{rg}">
					</div>
				</div>

				<div class="col-md-6">
					<label class="form-label">Telefone</label>
					<input id="phone" class="form-control" th:field="*{phone}" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">
					</div>
				</div>

				<div class="col-md-4">
					<label class="form-label">CEP</label>
					<input id="cep" class="form-control" th:field="*{cep}" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}">
					</div>
				</div>

				<div class="col-md-8">
					<label class="form-label">Logradouro</label>
					<input class="form-control" th:field="*{street}" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('street')}" th:errors="*{street}">
					</div>
				</div>

				<div class="col-md-4">
					<label class="form-label">Número</label>
					<input class="form-control" th:field="*{number}" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('number')}" th:errors="*{number}">
					</div>
				</div>

				<div class="col-md-8">
					<label class="form-label">Complemento</label>
					<input class="form-control" th:field="*{complement}">
				</div>

				<div class="col-md-6">
					<label class="form-label">Bairro</label>
					<input class="form-control" th:field="*{district}" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('district')}"
						th:errors="*{district}">
					</div>
				</div>

				<div class="col-md-4">
					<label class="form-label">Cidade</label>
					<input class="form-control" th:field="*{city}" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">
					</div>
				</div>

				<div class="col-md-2">
					<label class="form-label">UF</label>
					<input class="form-control" th:field="*{state}" maxlength="2" required>
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('state')}" th:errors="*{state}">
					</div>
				</div>

				<div class="col-md-12 mb-3">
					<label class="form-label">Crie uma senha</label>
					<input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Senha"
						minlength="8" required>

					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}"
						th:errors="*{password}">
					</div>
				</div>

				<div class="col-md-12 mb-3">
					<label class="form-label">Confirme sua senha</label>
					<input type="password" class="form-control" id="confirm" placeholder="Confirme sua senha" required
						oninput="this.setCustomValidity(this.value === document.getElementById('password').value ? '' : 'As senhas não correspondem')">
				</div>

			</div>

			<button class="btn btn-primary mt-4 w-100">
				Finalizar Cadastro
			</button>

		</form>

	</div>

	<script th:src="@{/scripts/employee-registration.js}"></script>

	<script>
		document.getElementById('password').addEventListener('input', function () {
			const confirm = document.getElementById('confirm');
			confirm.setCustomValidity(confirm.value === this.value ? '' : 'As senhas não correspondem');
		});
	</script>

</body>

</html>
