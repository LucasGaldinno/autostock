<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Funcionários - AutoStock</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

	<link rel="stylesheet" th:href="@{/styles/home.css}">
	<link rel="stylesheet" th:href="@{/styles/employee-list.css}">
	<link rel="stylesheet" th:href="@{/styles/toast.css}">
</head>

<body>

	<header class="home-header">
		<div class="home-header-inner">

			<div class="brand-block">
				<div class="brand-icon"><i class="fa-solid fa-car"></i></div>
				<div>
					<div class="brand-title">AutoStock</div>
					<div class="brand-subtitle">Gestão inteligente</div>
				</div>
			</div>

			<div class="header-actions">
				<a href="/home" class="header-icon"><i class="fa-solid fa-house"></i></a>
				<a href="/vehicles/fipe/consulta" class="header-icon"><i class="fa-solid fa-magnifying-glass"></i></a>
				<a th:href="@{/logout}" class="header-icon"><i class="fa-solid fa-right-from-bracket"></i></a>
			</div>
		</div>
	</header>

	<div th:replace="~{fragments/toast}"></div>

	<div class="container employees-container">

		<div class="page-title-wrapper">
			<div class="page-title-icon"><i class="fa-solid fa-users"></i></div>
			<h2 class="page-title-text">Funcionários da Agência</h2>
		</div>

		<div th:if="${#lists.isEmpty(employees)}" class="empty-card shadow-sm">
			Nenhum funcionário cadastrado ainda.
		</div>

		<div th:if="${!#lists.isEmpty(employees)}" class="table-card shadow-sm">

			<table class="table table-hover align-middle employee-table">
				<thead>
					<tr>
						<th>Nome</th>
						<th>Email</th>
						<th>Telefone</th>
						<th>Cidade</th>
						<th class="text-end">Ações</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="emp : ${employees}">
						<td th:text="${emp.firstName + ' ' + emp.lastName}"></td>
						<td th:text="${emp.email}"></td>
						<td th:text="${emp.phone}"></td>
						<td th:text="${emp.cidade}"></td>

						<td class="text-end actions-col">
							<a th:href="@{'/employees/edit/' + ${emp.id}}" class="action-btn edit-btn">
								<i class="fa-solid fa-pen"></i> Editar
							</a>

							<form th:action="@{'/employees/delete/' + ${emp.id}}" method="post" class="d-inline"
								onsubmit="confirmDeleteEmployee(event)">
								<button class="action-btn delete-btn">
									<i class="fa-solid fa-trash"></i> Excluir
								</button>
							</form>
						</td>
					</tr>
				</tbody>

			</table>
		</div>

		<div class="employee-mobile-list" th:if="${!#lists.isEmpty(employees)}">

			<div class="employee-mobile-card" th:each="emp : ${employees}">

				<div class="mob-line">
					<span class="mob-label">Nome:</span>
					<span th:text="${emp.firstName + ' ' + emp.lastName}"></span>
				</div>

				<div class="mob-line">
					<span class="mob-label">Email:</span>
					<span th:text="${emp.email}"></span>
				</div>

				<div class="mob-line">
					<span class="mob-label">Telefone:</span>
					<span th:text="${emp.phone}"></span>
				</div>

				<div class="mob-line">
					<span class="mob-label">Cidade:</span>
					<span th:text="${emp.cidade}"></span>
				</div>

				<div class="mob-actions">
					<a th:href="@{'/employees/edit/' + ${emp.id}}" class="mob-btn mob-edit">
						<i class="fa-solid fa-pen"></i> Editar
					</a>

					<form th:action="@{'/employees/delete/' + ${emp.id}}" method="post"
						onsubmit="confirmDeleteEmployee(event)">
						<button class="mob-btn mob-delete">
							<i class="fa-solid fa-trash"></i> Excluir
						</button>
					</form>
				</div>

			</div>

		</div>

	</div>

	<footer>
		© 2025 AutsoStock — Sistema completo para lojas de veículos.
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/scripts/toast.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script th:src="@{/scripts/employee-delete-confirm.js}"></script>

</body>

</html>
