<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Funcionário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/employee-edit.css}">
</head>
<body>

<div class="container mt-4">

    <h2 class="fw-bold mb-4">Editar Funcionário</h2>

    <form th:action="@{'/employees/edit/' + ${employee.id}}" method="post">
        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label fw-semibold">Nome</label>
                <input type="text" class="form-control" name="firstName"
                       th:value="${employee.firstName}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold">Sobrenome</label>
                <input type="text" class="form-control" name="lastName"
                       th:value="${employee.lastName}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold">Telefone</label>
                <input type="text" class="form-control"
                       id="phone"
                       name="phone"
                       maxlength="15"
                       th:value="${employee.phone}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label fw-semibold">CEP</label>
                <input type="text" class="form-control"
                       id="cep"
                       name="cep"
                       maxlength="9"
                       th:value="${employee.cep}" required>
            </div>

            <div class="col-md-8">
                <label class="form-label fw-semibold">Logradouro</label>
                <input type="text" class="form-control"
                       id="logradouro"
                       name="logradouro"
                       th:value="${employee.logradouro}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label fw-semibold">Número</label>
                <input type="text" class="form-control"
                       name="numero"
                       th:value="${employee.numero}" required>
            </div>

            <div class="col-md-8">
                <label class="form-label fw-semibold">Complemento</label>
                <input type="text" class="form-control"
                       name="complemento"
                       th:value="${employee.complemento}">
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold">Bairro</label>
                <input type="text" class="form-control"
                       id="bairro"
                       name="bairro"
                       th:value="${employee.bairro}" required>
            </div>

            <div class="col-md-4">
                <label class="form-label fw-semibold">Cidade</label>
                <input type="text" class="form-control"
                       id="cidade"
                       name="cidade"
                       th:value="${employee.cidade}" required>
            </div>

            <div class="col-md-2">
                <label class="form-label fw-semibold">UF</label>
                <input type="text" class="form-control"
                       id="uf"
                       name="uf"
                       maxlength="2"
                       th:value="${employee.uf}" required>
            </div>

        </div>

        <button class="btn btn-primary mt-4">
            <i class="bi bi-save"></i> Salvar Alterações
        </button>

        <a th:href="@{/employees}" class="btn btn-secondary mt-4 ms-2">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>

    </form>

</div>

<script th:src="@{/scripts/employee-edit.js}"></script>
</body>
</html>
