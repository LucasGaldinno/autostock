<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- CONTÊINER DOS TOASTS -->
<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">

    <!-- SUCCESS TOAST -->
    <div th:if="${toastSuccess}" 
         class="toast align-items-center text-bg-success border-0 fade show"
         role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${toastSuccess}">Operação realizada com sucesso!</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>

    <!-- ERROR TOAST -->
    <div th:if="${toastError}" 
         class="toast align-items-center text-bg-danger border-0 fade show"
         role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-x-circle-fill me-2"></i>
                <span th:text="${toastError}">Algo deu errado.</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>

</div>

</body>
</html>
