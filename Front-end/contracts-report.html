<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios de Contratos - AutoStock</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <link rel="stylesheet" th:href="@{/styles/reports-contracts.css}">
</head>

<body>

    <div class="mobile-menu-btn d-md-none" id="menuToggle">
        <i class="fas fa-bars"></i>
    </div>

    <div class="menu-overlay"></div>

    <div class="mobile-header-spacer d-block d-md-none"></div>

	<nav class="side-menu">
        <h4>AutoStock</h4>
        <hr>

        <a th:href="@{/home}" class="btn w-100 mb-2">Home</a>
        <a th:href="@{/vehicles}" class="btn w-100 mb-2">Veículos</a>
        <a th:href="@{/vehicles/fipe/consulta}" class="btn w-100 mb-2">FIPE</a>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn w-100 mt-4">Sair</button>
        </form>
    </nav>

    <div class="container-fluid main-content">
        <div class="row">
            <div class="col-12 col-md-10 offset-md-2 p-4">

                <h2 class="mb-4">Relatório de contratos de vendas</h2>

                <form id="reportForm" class="d-flex mb-2" onsubmit="return filterReport(event)">
                    <input type="date" name="startDate" th:value="${startDate}"
                           th:attr="min=${userCreated}, max=${today}" class="form-control me-2">

                    <input type="date" name="endDate" th:value="${endDate}"
                           th:attr="min=${userCreated}, max=${today}" class="form-control me-2">

                    <button type="submit" class="btn btn-primary">Filtrar</button>
                </form>

                <small class="text-muted">
                    Período disponível: de
                    <span th:text="${#temporals.format(userCreated, 'dd/MM/yyyy')}"></span>
                    até
                    <span th:text="${#temporals.format(today, 'dd/MM/yyyy')}"></span>.
                </small>

				<div th:if="${warningMsg}" class="alert alert-info mt-2" th:text="${warningMsg}"></div>
                <div th:if="${errorMsg}" class="alert alert-warning mt-2" th:text="${errorMsg}"></div>

                <div class="row mt-4 mb-4 g-4">
                    <div class="col-md-4">
                        <div class="metric-box">
                            <h5>Total de Vendas</h5>
                            <p th:text="|R$${#numbers.formatDecimal(totalSales == null ? 0 : totalSales, 0, 'POINT', 2, 'COMMA')}|"></p>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="metric-box">
                            <h5>Total de Lucro</h5>
                            <p th:text="|R$${#numbers.formatDecimal(totalProfit == null ? 0 : totalProfit, 0, 'POINT', 2, 'COMMA')}|"></p>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="metric-box">
                            <h5>Lucro (%)</h5>
                            <p th:text="|${#numbers.formatDecimal(totalProfitPercent == null ? 0 : totalProfitPercent, 0, 'POINT', 2, 'COMMA')} %|"></p>
                        </div>
                    </div>
                </div>

                <div class="row g-4">

                    <div class="col-12">
                        <div class="report-container">
                            <h5 class="text-center">Vendas & Lucro Mensal</h5>
                            <div id="contractsChart" class="big-chart"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="report-container">
                            <h5 class="text-center">Marcas Mais Vendidas</h5>
                            <div id="brandChart" class="small-chart"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="report-container">
                            <h5 class="text-center">Quantidade de Contratos por Mês</h5>
                            <div id="salesCountChart" class="small-chart"></div>
                        </div>
                    </div>
                </div>

                <div class="report-container mt-4">
                    <h5>Detalhes por Mês</h5>

                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Mês</th>
                                <th>Total de Vendas (R$)</th>
                                <th>Lucro (R$)</th>
                                <th>Lucro (%)</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="r : ${report}">
                                <td th:text="${r.monthName}"></td>
                                <td th:text="|${#numbers.formatDecimal(r.totalSales != null ? r.totalSales : 0, 1, 'POINT', 2, 'COMMA')}|"></td>
                                <td th:text="|${#numbers.formatDecimal(r.totalProfit != null ? r.totalProfit : 0, 1, 'POINT', 2, 'COMMA')}|"></td>
                                <td th:text="|${#numbers.formatDecimal(r.profitPercentage != null ? r.profitPercentage : 0, 1, 'POINT', 2, 'COMMA')} %|"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script th:inline="javascript">
        window.reportMonths = /*[[${labelsJson}]]*/[];
        window.reportSales   = /*[[${salesJson}]]*/[];
        window.reportProfits = /*[[${profitsJson}]]*/[];

        window.brandLabels = /*[[${brandLabelsJson}]]*/[];
        window.brandData   = /*[[${brandDataJson}]]*/[];

        window.quantityLabels = /*[[${quantityLabelsJson}]]*/[];
        window.quantityData   = /*[[${quantityDataJson}]]*/[];
    </script>

    <script src="/scripts/reports-contracts.js" th:src="@{/scripts/reports-contracts.js}"></script>

</body>
</html>
