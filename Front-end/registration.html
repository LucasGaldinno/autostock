<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - AutoStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles/registration.css}">
</head>
<body>
  <div class="card">
    <div class="title">Registre-se</div>
	<div class="step-indicator">
	    <div class="circle" data-step="1">1</div>
	    <div class="circle" data-step="2">2</div>
	    <div class="circle" data-step="3">3</div>
	</div>
	<div th:if="${param.success}" class="alert alert-success d-flex align-items-center shadow-sm fade show mt-2" role="alert"
	     style="border-radius: 10px; font-size: 0.95rem; background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; animation: fadeIn 0.6s ease;">
	  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-check-circle me-2" viewBox="0 0 16 16">
	    <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/>
	    <path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.992 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l1.94 1.94 3.647-4.293z"/>
	  </svg>
	  <div>
	    <strong>Cadastro realizado com sucesso!</strong><br>
	    Verifique seu e-mail para confirmar a ativação da sua conta.
	  </div>
	</div>
    <form th:action="@{/registration/register}" method="post" th:object="${user}">
	  <div th:if="${#fields.hasErrors('cnpj')}" class="alert alert-danger py-2">
	    <ul class="mb-0 ps-3">
	      <li th:each="err : ${#fields.errors('cnpj')}" th:text="${err}"></li>
	    </ul>
	  </div> 
      <div class="step active">
        <h6 class="fw-semibold text-primary mb-3">Dados da Empresa</h6>
		<div class="mb-3">
		  <input type="text" class="form-control" id="cnpj" th:field="*{cnpj}" placeholder="Digite o CNPJ" required>
		  <div id="cnpjError" class="invalid-feedback">CNPJ inválido. Verifique e tente novamente.</div>
		</div>
        <div class="mb-3">
          <input type="text" class="form-control" id="razaoSocial" th:field="*{razaoSocial}" placeholder="Razão Social" required readonly>
        </div>
        <div class="mb-3">
          <input type="text" class="form-control" id="nomeFantasia" th:field="*{nomeFantasia}" placeholder="Nome Fantasia" required>
        </div>

        <button type="button" class="btn btn-primary w-100" id="next1">Próximo</button>
      </div>
      <div class="step">
        <h6 class="fw-semibold text-primary mb-3">Endereço</h6>

        <div class="mb-3">
          <input type="text" class="form-control" id="cep" th:field="*{cep}" placeholder="CEP" required>
        </div>
        <div class="mb-3">
          <input type="text" class="form-control" id="logradouro" th:field="*{logradouro}" placeholder="Logradouro" required>
        </div>
        <div class="mb-3">
          <input type="text" class="form-control" id="numero" th:field="*{numero}" placeholder="Número" required>
        </div>
        <div class="mb-3">
          <input type="text" class="form-control" id="complemento" th:field="*{complemento}" placeholder="Complemento">
        </div>
        <div class="mb-3">
          <input type="text" class="form-control" id="bairro" th:field="*{bairro}" placeholder="Bairro" required>
        </div>
        <div class="mb-3">
          <input type="text" class="form-control" id="cidade" th:field="*{cidade}" placeholder="Cidade" required>
        </div>
        <div class="mb-3">
          <input type="text" class="form-control" id="uf" th:field="*{uf}" placeholder="UF" maxlength="2" required>
        </div>

        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-secondary" id="back1">Voltar</button>
          <button type="button" class="btn btn-primary" id="next2">Próximo</button>
        </div>
      </div>
      <div class="step">
        <h6 class="fw-semibold text-primary mb-3">Conta de Acesso</h6>

		  <div th:if="${#fields.hasErrors('email')}" class="alert alert-danger py-2">
		    <ul class="mb-0 ps-3">
		      <li th:each="err : ${#fields.errors('email')}" th:text="${err}"></li>
		    </ul>
		  </div>
		  <div th:if="${#fields.hasErrors('telefone')}" class="alert alert-danger py-2">
		    <ul class="mb-0 ps-3">
		      <li th:each="err : ${#fields.errors('telefone')}" th:text="${err}"></li>
		    </ul>
		  </div>
		  <div th:if="${#fields.hasErrors('password')}" class="alert alert-danger py-2">
		    <ul class="mb-0 ps-3">
		      <li th:each="err : ${#fields.errors('password')}" th:text="${err}"></li>
		    </ul>
		  </div>
		  <div th:if="${#fields.hasErrors('termsAccepted')}" class="alert alert-danger py-2">
		    <ul class="mb-0 ps-3">
		      <li th:each="err : ${#fields.errors('termsAccepted')}" th:text="${err}"></li>
		    </ul>
		  </div>
		  
        <div class="mb-3">
          <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Digite seu e-mail" required>
        </div>
        <div class="mb-3">
          <input type="tel" class="form-control" id="telefone" th:field="*{telefone}" placeholder="(11) 99999-9999" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Senha" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" id="confirm" placeholder="Confirme sua senha" required
            oninput="this.setCustomValidity(this.value === document.getElementById('password').value ? '' : 'As senhas não correspondem')">
        </div>

        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="termsAccepted" th:field="*{termsAccepted}" required>
		  <label class="form-check-label" for="termsAccepted">
		      Aceito os 
		      <a href="/terms" class="text-decoration-none" target="_blank">Termos de Uso</a> 
		      e a 
		      <a href="/terms" class="text-decoration-none" target="_blank">Política de Privacidade</a>
		  </label>
        </div>

        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-secondary" id="back2">Voltar</button>
          <button type="submit" class="btn btn-success">Cadastrar</button>
        </div>
      </div>
	  <div class="text-center mt-3">
		  <span class="text-muted" style="font-size: 0.9rem;">
		    Já possui cadastro?
		    <a href="/login" class="text-primary text-decoration-none fw-semibold">
		      Clique aqui
		    </a>
		  </span>
	 </div>
    </form>

    <footer>© 2025 AutoStock</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/imask"></script>
  <script src="/scripts/registration.js" th:src="@{/scripts/registration.js}"></script>
</body>
</html>
